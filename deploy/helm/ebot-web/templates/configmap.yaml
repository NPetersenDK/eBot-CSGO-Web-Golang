{{- range $key, $value := .Values.env }}
{{- if regexMatch "(PASSWORD|SECRET|SESSION_KEY|API_KEYS|_DSN)$" $key }}
{{- fail (printf "env.%s looks like a secret. Put it in the Secret named by secrets.existingSecret instead." $key) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ebot-web.fullname" . }}
  labels:
    {{- include "ebot-web.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
