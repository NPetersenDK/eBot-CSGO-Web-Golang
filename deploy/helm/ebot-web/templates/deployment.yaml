apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ebot-web.fullname" . }}
  labels:
    {{- include "ebot-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ebot-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ebot-web.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ebot-web.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ebot-web
          image: {{ include "ebot-web.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ebot-web.fullname" . }}
          env:
            - name: EBOT_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.sessionKey | quote }}
            {{- if .Values.secrets.dbDsn }}
            - name: EBOT_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.dbDsn | quote }}
            {{- else }}
            - name: EBOT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.dbPassword | quote }}
            {{- end }}
            {{- with .Values.secrets.redisPassword }}
            - name: EBOT_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret | quote }}
                  key: {{ . | quote }}
                  optional: true
            {{- end }}
            {{- with .Values.secrets.oidcClientSecret }}
            - name: EBOT_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret | quote }}
                  key: {{ . | quote }}
                  optional: true
            {{- end }}
            {{- with .Values.secrets.adminPassword }}
            - name: EBOT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret | quote }}
                  key: {{ . | quote }}
                  optional: true
            {{- end }}
            {{- with .Values.secrets.apiKeys }}
            - name: EBOT_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret | quote }}
                  key: {{ . | quote }}
                  optional: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- range $name, $vol := .Values.volumes }}
            {{- if $vol.enabled }}
            - name: {{ $name }}
              mountPath: {{ $vol.mountPath }}
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- range $name, $vol := .Values.volumes }}
        {{- if $vol.enabled }}
        - name: {{ $name }}
          {{- if $vol.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $vol.existingClaim }}
            readOnly: true
          {{- else if $vol.hostPath }}
          hostPath:
            path: {{ $vol.hostPath }}
            type: Directory
          {{- else }}
          {{- fail (printf "volumes.%s: set existingClaim or hostPath when enabled" $name) }}
          {{- end }}
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
