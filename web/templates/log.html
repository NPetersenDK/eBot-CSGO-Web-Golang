{{define "content"}}
{{with .Data}}
<div class="stack">
  <div class="row wrap">
    <a class="btn ghost" href="/matches/{{.ID}}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back to match</a>
    <h2>Match log #{{.ID}}</h2>
  </div>

</div>
{{end}}
{{end}}
